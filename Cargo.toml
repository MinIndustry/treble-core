[package]
name = "treble"
description = "Treble — modular real-time audio synthesis in Rust"
license = "MIT"
repository = "https://github.com/MinIndustry/treble-core"
version = "0.5.2"
edition = "2024"

[dependencies]
atomic_float = { version = "0.1", optional = true }
chrono = { version = "0.4.38", optional = true }
cpal = { version = "0.15.3", optional = true }
crossbeam = { version = "0.8", optional = true }
directories = { version = "6.0.0", optional = true }
dyn-clone = "1.0.18"
log = { version = "0.4.22", features = ["release_max_level_warn"] }
petgraph = "0.6.5"
rand = { version = "0.8.5", default-features = false, features = ["small_rng"] }
serde = { version = "1.0.205", features = ["derive", "serde_derive"] }
simplelog = { version = "0.12.2", optional = true }
thiserror = "2.0.12"
toml = { version = "0.8.22", optional = true }
typetag = "0.2.21"
inventory = "0.3"
treble-derive = "0.3.0"
treble-meta = "0.3.0"
evdev = { version = "0.12.2", optional = true }
plotters = { version = "0.3.7", optional = true }
hound = "3.5.1"

serde_json = "1.0"

[dev-dependencies]
pretty_assertions = "1.1.0"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "graph"
harness = false

[[example]]
name = "drum_machine"
required-features = ["native"]

[[example]]
name = "multi_kick"
required-features = ["native"]

[[example]]
name = "plot_hihat"
required-features = ["native"]

[[example]]
name = "plot_chord"
required-features = ["native"]

[[example]]
name = "plot_kick"
required-features = ["native"]

[[example]]
name = "plot_snare"
required-features = ["native"]

[[example]]
name = "one_note"
required-features = ["native"]

[features]
native = [
    "dep:atomic_float",
    "dep:chrono",
    "dep:cpal",
    "dep:crossbeam",
    "dep:directories",
    "dep:simplelog",
    "dep:toml",
]
plotting = ["plotters"]
ts = ["treble-meta/ts"]
input = ["evdev"]

# Testing
slow-test = []

# Platforms
linux = ["input"]
macos = []
windows = []

# Default features
default = ["native"]
