name: Tests

# Required gate for merging into main. Branch protection requires `test`,
# `lint (informative)` and `bench-regression`. Despite the name, that job is
# enforced, not advisory — and the name must stay exactly as it is, because
# branch protection matches required checks by name. Renaming it silently
# blocks every PR on a check that never reports.
#
# `lint` runs fmt + clippy -D warnings across all targets and features. Note
# that CI's toolchain may be newer than a local one and so carry lints a local
# run never emits (1.98 added `drain_collect` and
# `chunks_exact_to_as_chunks`, both of which were clean locally on 1.97), so a
# green local run is not proof this job passes.

on:
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system build deps (cpal → ALSA, plotters → fontconfig)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

  lint:
    name: lint (informative)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system build deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --features plotting,ts --all-targets -- -D warnings
